<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>智能盲人导航助手</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- 顶部状态栏 -->
    <header class="app-header">
      <div class="header-left">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">正在初始化...</span>
      </div>
      <div class="header-right">
        <button class="header-btn" id="muteBtn" title="静音切换">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>
      </div>
    </header>

    <!-- 主视频区域 -->
    <main class="camera-view">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay" class="overlay-canvas"></canvas>
      
      <!-- 方向指示器 -->
      <div class="direction-panel" id="directionPanel">
        <div class="direction-arrow-container">
          <svg class="direction-arrow" id="directionArrow" viewBox="0 0 200 200">
            <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
            <circle cx="100" cy="100" r="70" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
            <!-- 盲道方向箭头 -->
            <g id="arrowGroup" transform="rotate(0 100 100)">
              <path d="M100 40 L130 90 L110 90 L110 150 L90 150 L90 90 L70 90 Z" 
                    fill="#00E676" stroke="#fff" stroke-width="2"/>
            </g>
            <text x="100" y="185" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">盲道方向</text>
          </svg>
        </div>
        <div class="direction-label" id="directionLabel">等待识别...</div>
        <div class="direction-confidence" id="directionConfidence"></div>
      </div>

      <!-- 识别信息面板 -->
      <div class="info-panel" id="infoPanel">
        <div class="info-item blindway-info" id="blindwayInfo">
          <span class="info-icon">🟩</span>
          <span class="info-text">盲道: 检测中</span>
        </div>
        <div class="info-item crosswalk-info" id="crosswalkInfo">
          <span class="info-icon">🦓</span>
          <span class="info-text">斑马线: 未检测</span>
        </div>
        <div class="info-item traffic-info" id="trafficInfo">
          <span class="info-icon">🚦</span>
          <span class="info-text">红绿灯: 未检测</span>
        </div>
        <div class="info-item obstacle-info" id="obstacleInfo">
          <span class="info-icon">⚠️</span>
          <span class="info-text">障碍物: 安全</span>
        </div>
      </div>

      <!-- 语音字幕 -->
      <div class="subtitle-bar" id="subtitleBar">
        <span id="subtitleText">点击下方按钮开启镜头</span>
      </div>
    </main>

    <!-- 底部控制栏 -->
    <footer class="control-bar">
      <button class="ctrl-btn secondary" id="settingsBtn">
        <svg class="icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        <span>设置</span>
      </button>
      
      <button class="ctrl-btn primary" id="startBtn">
        <div class="start-btn-inner">
          <svg class="icon large" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
          <span>开启镜头</span>
        </div>
      </button>
      
      <button class="ctrl-btn secondary" id="voiceBtn">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 15c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v7c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 15 6.7 12H5c0 3.42 2.72 6.23 6 6.72V22h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
        <span>语音</span>
      </button>
    </footer>

    <!-- 设置弹窗 -->
    <div class="modal-overlay" id="settingsModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>设置</h2>
          <button class="close-btn" id="closeSettings">×</button>
        </div>
        <div class="modal-body">
          <div class="setting-item">
            <label class="setting-label">语音播报间隔</label>
            <select id="intervalSelect" class="setting-select">
              <option value="2">2秒</option>
              <option value="3" selected>3秒</option>
              <option value="5">5秒</option>
              <option value="8">8秒</option>
            </select>
          </div>
          <div class="setting-item">
            <label class="setting-label">语速</label>
            <input type="range" id="rateSlider" min="0.5" max="2" step="0.1" value="1" class="setting-slider">
            <span id="rateValue">1.0</span>
          </div>
          <div class="setting-item">
            <label class="setting-label">检测灵敏度</label>
            <select id="sensitivitySelect" class="setting-select">
              <option value="0.3">低</option>
              <option value="0.5" selected>中</option>
              <option value="0.7">高</option>
            </select>
          </div>
          <div class="setting-item">
            <label class="setting-label">摄像头</label>
            <select id="cameraSelect" class="setting-select">
              <option value="environment">后置摄像头</option>
              <option value="user">前置摄像头</option>
            </select>
          </div>
          <div class="setting-item toggle-item">
            <label class="setting-label">障碍物预警</label>
            <label class="switch">
              <input type="checkbox" id="obstacleToggle" checked>
              <span class="slider"></span>
            </label>
          </div>
          <div class="setting-item toggle-item">
            <label class="setting-label">显示检测框</label>
            <label class="switch">
              <input type="checkbox" id="boxToggle" checked>
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- 加载遮罩 -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-content">
        <div class="spinner"></div>
        <p id="loadingText">正在加载AI模型...</p>
        <p class="loading-hint">首次加载需要约10秒</p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
